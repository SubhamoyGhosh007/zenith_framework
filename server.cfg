# # # # # # # # # # # # # # # # # # # # # # # # # # #
#      Zenith Framework Master Config Skeleton      #
# # # # # # # # # # # # # # # # # # # # # # # # # # #

# Connection settings
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# Enforce GTA V Expanded & Enhanced game build (3258 - Bottom Dollar Bounties)
sv_enforceGameBuild 3258

# Database Connection (ox_mysql configuration)
# Modify connection string credentials to match your MySQL database
set mysql_connection_string "mysql://root:zenith@127.0.0.1/zenith_framework?charset=utf8mb4"
set mysql_slow_query_limit 100
set mysql_ui true

# Framework configuration overrides (example overrides)
set cfg_core_debug "true"
set cfg_characters_max_slots "10"
set cfg_money_payday_interval "1800" # 30 minutes in seconds

# Standard resources (System / Defaults)
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure basicgamemode
ensure hardcap

# Dependencies
ensure zenith-migrations    # Loads first to verify database migrations
ensure ox_mysql             # Overextended database driver
ensure ox_lib               # Overextended helper library

# Core framework resources (Ensure order based on dependency graph)
ensure zenith-core
ensure zenith-player
ensure zenith-characters
ensure ox_inventory         # Customized UI inventory fork
ensure zenith-money
ensure zenith-jobs
ensure zenith-spawn
ensure zenith-housing
ensure zenith-admin
ensure zenith-permissions
ensure zenith-nui           # Loads last to establish UI hooks
