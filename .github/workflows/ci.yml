name: CI

on:
  push:
    branches: [main, 'zenith/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lua:
    name: Lua lint (stylua --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          version: latest
          args: --check resources/

  nui:
    name: NUI lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Lint Zenith NUI
        run: pnpm -C resources/zenith-nui/web lint
      - name: Typecheck Zenith NUI
        run: pnpm -C resources/zenith-nui/web typecheck
      - name: Build Zenith NUI
        run: pnpm -C resources/zenith-nui/web build
      - name: Build ox_inventory NUI
        run: pnpm -C resources/ox_inventory/web build
      - name: Upload Zenith dist
        uses: actions/upload-artifact@v4
        with:
          name: zenith-nui-dist
          path: resources/zenith-nui/web/dist
          if-no-files-found: error
          retention-days: 7
      - name: Upload ox_inventory dist
        uses: actions/upload-artifact@v4
        with:
          name: ox-inventory-dist
          path: resources/ox_inventory/web/build
          if-no-files-found: error
          retention-days: 7

  migrations-smoke:
    name: Migrations smoke (MySQL 8)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: zenith
          MYSQL_DATABASE: zenith_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Apply full schema
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -pzenith zenith_test < sql/schema.sql
      - name: Assert migrations recorded
        run: |
          ROWS=$(mysql -h 127.0.0.1 -P 3306 -uroot -pzenith -N -B -e "SELECT COUNT(*) FROM zenith_test.schema_migrations")
          echo "schema_migrations rows: $ROWS"
          test "$ROWS" -gt 0
